<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" aria-label="EAOIN logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0f3a"/>
      <stop offset="0.5" stop-color="#3a1a6a"/>
      <stop offset="1" stop-color="#1a1a4a"/>
    </linearGradient>
    <linearGradient id="cubeA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a5cff"/>
      <stop offset="1" stop-color="#5c2ad0"/>
    </linearGradient>
    <linearGradient id="cubeB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2aa8e0"/>
      <stop offset="1" stop-color="#2a6ac8"/>
    </linearGradient>
    <linearGradient id="cubeC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#c8902a"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="248" height="248" rx="48" fill="url(#bg)"/>
  <g transform="translate(40,40)">
    <!-- three interlocking voxel faces -->
    <rect x="78" y="14" width="100" height="34" rx="4" fill="url(#cubeA)" transform="rotate(45 128 31)"/>
    <rect x="40" y="120" width="100" height="34" rx="4" fill="url(#cubeB)" transform="rotate(45 90 137)"/>
    <rect x="116" y="120" width="100" height="34" rx="4" fill="url(#cubeC)" transform="rotate(45 166 137)"/>
    <!-- glow -->
    <circle cx="128" cy="122" r="70" fill="none" stroke="rgba(140,120,255,0.5)" stroke-width="2"/>
  </g>
</svg>
