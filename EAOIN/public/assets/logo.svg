<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" aria-label="EAOIN logo">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.24" stop-color="#d9e0e6"/>
      <stop offset="0.54" stop-color="#9ca8b3"/>
      <stop offset="0.55" stop-color="#56616d"/>
      <stop offset="0.72" stop-color="#89939d"/>
      <stop offset="1" stop-color="#3c4651"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0e13"/>
      <stop offset="1" stop-color="#05060a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="88" fill="url(#bg)"/>
  <g>
    <!-- greyish 3D letter extrusion: EAOIN -->
    <g font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="168"
       letter-spacing="-6" text-anchor="middle">
      <!-- depth extrusion (darker) -->
      <text x="256" y="330" fill="#141a20" transform="translate(0,14)">EAOIN</text>
      <text x="256" y="330" fill="#2e3741" transform="translate(0,8)">EAOIN</text>
      <text x="256" y="330" fill="#4d5965" transform="translate(0,4)">EAOIN</text>
      <!-- metallic face -->
      <text x="256" y="330" fill="url(#metal)">EAOIN</text>
    </g>
    <!-- soft under-glow -->
    <ellipse cx="256" cy="392" rx="150" ry="22" fill="#56616d" opacity="0.28"/>
  </g>
</svg>
