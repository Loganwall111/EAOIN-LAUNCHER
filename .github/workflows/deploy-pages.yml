name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: EAOIN/package-lock.json
      - run: npm ci
        working-directory: EAOIN
      - name: Build
        env:
          BASE_PATH: /EAOIN-LAUNCHER/
        run: npm run build
        working-directory: EAOIN
      - uses: actions/upload-pages-artifact@v3
        with:
          path: EAOIN/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
